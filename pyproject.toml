[project]
name = "plamo-translate"
version = "1.1.0"
description = "A command-line interface for translation using the plamo-2-translate model with local execution."
readme = "README.md"
authors = [
    { name = "Shunta Saito", email = "shunta@preferred.jp" },
]
requires-python = ">=3.10"
keywords = [
    "machine translation",
    "transformer",
    "nlp",
    "natural language processing",
    "deep learning",
    "mlx",
    "mlx-lm",
    "sentencepiece",
    "plamo",
    "plamo-translate",
    "plamo-translate-cli",
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Topic :: Utilities",
    "Environment :: MacOS X",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.9.2,<2",
    "numba>=0.60.0",
    "mlx-lm>=0.31.2,<0.32 ; sys_platform == 'darwin'",
    "transformers>=4.46,<5",
]

[tool.uv]
override-dependencies = ["transformers<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["tests", "docs", "examples", "scripts", "notebooks", "data", "tmp", "benchmarks", ".local"]

[tool.hatch.build.targets.wheel]
compression = "stored"
# Twine 6.2 supports Core Metadata through version 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
compress-level = 0

[project.scripts]
plamo-translate = "plamo_translate.main:main"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "ipdb>=0.13.13",
    "jinja2>=3.1.0",
    "pytest>=8.4.0",
    "ruff>=0.11.12",
    "sacrebleu>=2.6.0",
    "twine>=6.1.0",
    "wheel>=0.45.1",
]
